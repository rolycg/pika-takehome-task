[project]
name = "create-image-backend"
version = "0.1.0"
description = "Create Image backend: FastAPI + SQLite + mocked async image provider"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["app"]
python_files = ["test_*.py"]

[tool.uv]
package = false
